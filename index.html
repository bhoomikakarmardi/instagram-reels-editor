


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:20px}
.app{max-width:520px;margin:auto}
h1{color:#f2a6c7;font-size:30px}
p{color:#bbb;line-height:1.5}
label{display:block;margin:15px 0 7px}
input,select,button{font:inherit}
input[type=text],select{width:100%;padding:13px;border:1px solid #555;border-radius:9px;background:#222;color:white;margin-top:7px}
button,.upload{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:#f2a6c7;color:#171017;font-weight:700;text-align:center;margin:12px 0;cursor:pointer}
button:disabled{opacity:.5}
.upload input{display:none}
.preview{position:relative;width:100%;max-width:300px;aspect-ratio:9/16;background:#25212a;margin:20px auto;overflow:hidden;border-radius:15px}
#video{width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;top:45%;left:5%;width:90%;text-align:center;font-weight:800;overflow-wrap:anywhere;text-shadow:0 2px 8px #000;pointer-events:none}
small{color:#bbb;line-height:1.6}
#status{white-space:pre-wrap;color:#f2a6c7}
</style>
</head>
<body>
<main class="app">
<h1>Reels Studio ✨</h1>
<p>Edit your video for Instagram Reels.</p>

<label class="upload">📁 Upload your video
<input id="file" type="file" accept="video/*">
</label>

<div class="preview">
<video id="video" controls playsinline webkit-playsinline></video>
<div id="overlay">DISCIPLINE OVER MOTIVATION</div>
</div>

<label>Text overlay
<input id="caption" type="text" value="DISCIPLINE OVER MOTIVATION" maxlength="120">
</label>

<label>Text colour
<input id="color" type="color" value="#ffffff">
</label>

<label>Text size
<input id="size" type="range" min="16" max="48" value="28">
</label>

<label>Video filter
<select id="filter">
<option value="none">Original</option>
<option value="contrast(1.15) saturate(1.2)">Cinematic</option>
<option value="brightness(1.1) saturate(0.8)">Soft</option>
<option value="grayscale(1)">Black &amp; white</option>
<option value="sepia(0.4)">Vintage</option>
</select>
</label>

<button id="export" disabled>Export edited video</button>
<p id="status">Upload a video to begin.</p>
<small>Export records the video with your selected filter and text. Keep this page open while exporting. Long videos may require more memory.</small>
</main>

<script>
const fileInput=document.getElementById('file');
const video=document.getElementById('video');
const overlay=document.getElementById('overlay');
const caption=document.getElementById('caption');
const color=document.getElementById('color');
const size=document.getElementById('size');
const filter=document.getElementById('filter');
const exportBtn=document.getElementById('export');
const status=document.getElementById('status');
let videoURL=null;
let busy=false;

function updatePreview(){
 overlay.textContent=caption.value||'';
 overlay.style.color=color.value;
 overlay.style.fontSize=size.value+'px';
 video.style.filter=filter.value;
}
caption.addEventListener('input',updatePreview);
color.addEventListener('input',updatePreview);
size.addEventListener('input',updatePreview);
filter.addEventListener('change',updatePreview);

fileInput.addEventListener('change',()=>{
 const f=fileInput.files&&fileInput.files[0];
 if(!f)return;
 if(!f.type.startsWith('video/')){
   status.textContent='Please choose a video file.';
   return;
 }
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;
 video.load();
 exportBtn.disabled=false;
 status.textContent='Video loaded. Preview your edits, then export.';
 updatePreview();
});

function chooseMime(){
 const types=[
  'video/mp4;codecs=avc1.42E01E',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm'
 ];
 if(!window.MediaRecorder)return '';
 return types.find(t=>MediaRecorder.isTypeSupported(t))||'';
}

function drawCover(ctx,source,w,h){
 const sw=source.videoWidth,sh=source.videoHeight;
 if(!sw||!sh)return;
 const scale=Math.max(w/sw,h/sh);
 const dw=sw*scale,dh=sh*scale;
 ctx.drawImage(source,(w-dw)/2,(h-dh)/2,dw,dh);
}

function drawCaption(ctx,w,h){
 const text=caption.value.trim();
 if(!text)return;
 const px=Number(size.value)*2;
 ctx.font='800 '+px+'px Arial,sans-serif';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillStyle=color.value;
 ctx.shadowColor='rgba(0,0,0,.9)';
 ctx.shadowBlur=10;
 ctx.shadowOffsetY=3;

 const maxWidth=w*.84;
 const words=text.split(/\s+/);
 const lines=[];
 let line='';
 for(const word of words){
  const test=line?line+' '+word:word;
  if(ctx.measureText(test).width>maxWidth&&line){
   lines.push(line);line=word;
  }else line=test;
 }
 if(line)lines.push(line);
 const lineHeight=px*1.18;
 let y=h*.45-(lines.length-1)*lineHeight/2;
 for(const l of lines){
  ctx.fillText(l,w/2,y,maxWidth);
  y+=lineHeight;
 }
 ctx.shadowColor='transparent';
 ctx.shadowBlur=0;
 ctx.shadowOffsetY=0;
}

exportBtn.addEventListener('click',async()=>{
 if(busy)return;
 if(!video.src||!video.videoWidth){
  status.textContent='Upload a video first.';
  return;
 }
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
  status.textContent='This browser does not support the required video export features. Try the latest Safari version.';
  return;
 }
 const mime=chooseMime();
 if(!mime){
  status.textContent='No supported video recording format was detected in this browser.';
  return;
 }

 busy=true;
 exportBtn.disabled=true;
 let canvasStream=null,sourceStream=null,recorder=null,raf=0;
 const chunks=[];
 const canvas=document.createElement('canvas');
 canvas.width=720;canvas.height=1280;
 const ctx=canvas.getContext('2d');
 const previousTime=video.currentTime;
 const wasMuted=video.muted;
 let finished=false;

 function cleanup(){
  cancelAnimationFrame(raf);
  if(canvasStream)canvasStream.getTracks().forEach(t=>t.stop());
  if(sourceStream)sourceStream.getTracks().forEach(t=>t.stop());
  video.pause();
  video.currentTime=previousTime;
  video.muted=wasMuted;
  busy=false;
  exportBtn.disabled=false;
 }

 try{
  await video.pause();
  video.currentTime=0;
  await new Promise((resolve,reject)=>{
   if(video.readyState>=2){resolve();return}
   video.addEventListener('loadeddata',resolve,{once:true});
   video.addEventListener('error',()=>reject(new Error('Could not read this video.')),{once:true});
  });

  canvasStream=canvas.captureStream(30);

  const capture=video.captureStream||video.webkitCaptureStream;
  if(capture){
   try{
    sourceStream=capture.call(video);
    sourceStream.getAudioTracks().forEach(t=>canvasStream.addTrack(t));
   }catch(e){}
  }

  recorder=new MediaRecorder(canvasStream,{mimeType:mime});
  recorder.ondataavailable=e=>{
   if(e.data&&e.data.size)chunks.push(e.data);
  };
  recorder.onerror=()=>{
   if(!finished){
    finished=true;cleanup();
    status.textContent='Export failed. Try a shorter video or another browser.';
   }
  };
  recorder.onstop=()=>{
   if(finished)return;
   finished=true;
   const blob=new Blob(chunks,{type:recorder.mimeType||mime});
   cleanup();
   if(!blob.size){
    status.textContent='No video data was produced. Please try again.';
    return;
   }
   const ext=blob.type.includes('mp4')?'mp4':'webm';
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url;
   a.download='reels-studio-edit.'+ext;
   document.body.appendChild(a);
   a.click();
   a.remove();
   status.textContent='Export created ('+ext+'). If it opens instead of downloading, use the Share menu to save it to Files.';
   setTimeout(()=>URL.revokeObjectURL(url),60000);
  };

  function render(){
   if(finished)return;
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.save();
   ctx.filter=filter.value;
   drawCover(ctx,video,canvas.width,canvas.height);
   ctx.restore();
   drawCaption(ctx,canvas.width,canvas.height);
   if(!video.ended&&!video.paused)raf=requestAnimationFrame(render);
  }

  video.muted=true;
  video.addEventListener('ended',()=>{
   if(recorder&&recorder.state!=='inactive')recorder.stop();
  },{once:true});

  render();
  recorder.start(250);
  status.textContent='Exporting your video… Keep this page open.';
  await video.play();

 }catch(err){
  if(recorder&&recorder.state!=='inactive'){
   try{recorder.stop()}catch(e){}
  }
  if(!finished){
   finished=true;cleanup();
   status.textContent='Could not export: '+(err.message||'Please try a shorter video.');
  }
 }
});

updatePreview();
</script>
</body>
</html>
