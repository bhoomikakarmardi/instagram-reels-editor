

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reels Studio</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;padding:22px}

h1{color:#f6a8c8;margin-bottom:5px}

p{color:#bbb}

.app{max-width:500px;margin:auto}

button,.upload{background:#f6a8c8;color:#171017;border:0;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer}

input,select{max-width:100%;padding:10px;border-radius:8px;margin:6px 0}

.controls{display:grid;gap:12px;margin-top:18px}

.preview{width:100%;max-width:320px;aspect-ratio:9/16;background:#29232c;margin:18px auto;border-radius:18px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

video{width:100%;height:100%;object-fit:contain;position:absolute}

#overlay{position:absolute;z-index:2;top:45%;width:90%;text-align:center;font-size:28px;font-weight:bold;text-shadow:0 2px 8px #000;overflow-wrap:anywhere}

label{display:block;margin-top:8px}

input[type=text]{width:100%}

.note{font-size:12px;line-height:1.5}

</style>

</head>

<body>

<div class="app">

<h1>Reels Studio ✨</h1>

<p>Your videos. Your style. Your Reels.</p>

<label class="upload">

📁 Upload your video

<input id="file" type="file" accept="video/*" hidden>

</label>

<div class="preview" id="preview">

<video id="video" controls playsinline></video>

<div id="overlay">Your next Reel ✨</div>

</div>

<div class="controls">

<label>Text overlay

<input id="caption" type="text" placeholder="Write your Reel caption">

</label>

<label>Text colour

<input id="color" type="color" value="#ffffff">

</label>

<label>Text size

<input id="size" type="range" min="16" max="48" value="28">

</label>

<label>Video filter

<select id="filter">

<option value="none">Original</option>

<option value="contrast(1.15) saturate(1.2)">Cinematic</option>

<option value="brightness(1.1) saturate(0.8)">Soft</option>

<option value="grayscale(1)">Black & white</option>

<option value="sepia(0.4)">Vintage</option>

</select>

</label>

<button id="download">Download video</button>

<p class="note">Choose a video, add your text and preview filters. Video export will be enabled in the next development step.</p>

</div>

</div>

<script>

const file=document.getElementById('file');

const video=document.getElementById('video');

const overlay=document.getElementById('overlay');

let videoURL;

file.addEventListener('change',()=>{

  if(videoURL)URL.revokeObjectURL(videoURL);

  if(file.files[0]){

    videoURL=URL.createObjectURL(file.files[0]);

    video.src=videoURL;

    video.style.filter=document.getElementById('filter').value;

  }

});

document.getElementById('caption').addEventListener('input',e=>{

  overlay.textContent=e.target.value||'Your next Reel ✨';

});

document.getElementById('color').addEventListener('input',e=>{

  overlay.style.color=e.target.value;

});

document.getElementById('size').addEventListener('input',e=>{

  overlay.style.fontSize=e.target.value+'px';

});

document.getElementById('filter').addEventListener('change',e=>{

  video.style.filter=e.target.value;

});

document.getElementById('download').addEventListener('click',()=>{

  alert('Video export is coming in the next development step.');

});

</script>

</body>

</html>
